version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lansnix-backend
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - DB_PATH=/data/lansnix.db
      - LOG_LEVEL=info
      - SCAN_INTERVAL=60
      - PORT_SCAN_ENABLED=true
    volumes:
      - ./data:/data
      - ./logs:/logs
    labels:
      - "com.lansnix.description=LANsnix Backend Service"
      - "com.lansnix.author=Yasir Ispawoo"
      - "com.lansnix.url=https://github.com/ispawoo/lansnix"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: lansnix-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
      - NODE_ENV=production
    depends_on:
      - backend
    labels:
      - "com.lansnix.description=LANsnix Frontend Service"
      - "com.lansnix.author=Yasir Ispawoo"
      - "com.lansnix.url=https://github.com/ispawoo/lansnix"
